<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartQueue – prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F4;--card:#fff;--ink:#16262D;--mut:#5A6C74;--line:#D5DFE2;--pri:#0E6B6B;--prif:#fff;--warn:#F2B01E;--warnink:#3b2a00;--ok:#2E7D4F;--okink:#fff;--bad:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1E;--card:#17262C;--ink:#E7F0F2;--mut:#9DB1B8;--line:#2A3E45;--pri:#4FC1C1;--prif:#04292A;--ok:#7FD39F;--okink:#06260F;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1E;--card:#17262C;--ink:#E7F0F2;--mut:#9DB1B8;--line:#2A3E45;--pri:#4FC1C1;--prif:#04292A;--ok:#7FD39F;--okink:#06260F;--bad:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
header{padding:16px 20px 8px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}.sub{color:var(--mut);margin:2px 0 0}
main{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;padding:8px 20px 28px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.phone{background:var(--card);border:2px solid var(--ink);border-radius:28px;padding:18px;min-height:440px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
button.p{background:var(--pri);color:var(--prif);border-color:var(--pri);font-weight:700}
button.on{background:var(--ink);color:var(--bg)}button[disabled]{opacity:.45;cursor:not-allowed}
input,select{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 12px}
.num{font-size:56px;font-weight:700;line-height:1.1;color:var(--pri)}
.ban{padding:10px 12px;border-radius:8px;margin:12px 0;font-weight:700}
.warn{background:var(--warn);color:var(--warnink)}.go{background:var(--ok);color:var(--okink)}.mut{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--pri)}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}.row b{min-width:58px}.sp{flex:1;min-width:120px}
.cur{background:color-mix(in srgb,var(--pri) 14%,transparent);border-radius:6px;padding-inline:6px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.stats{display:flex;gap:14px;margin-bottom:6px;color:var(--mut)}.stats b{color:var(--ink)}
.kb{display:grid;gap:10px}.kb button{padding:16px;font-size:18px}
#toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:20;max-width:320px}
.toast{background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px}
</style></head><body>
<header><h1>SmartQueue</h1><p class="sub">Prototipo: toma tu número en el celular de la izquierda y gestiona la fila como personal de la clínica a la derecha.</p></header>
<main><section class="phone" id="phone" aria-label="Celular del paciente"></section>
<section class="panel"><div class="tabs"><button data-a="tab" data-v="staff">Personal</button><button data-a="tab" data-v="kiosk">Kiosko</button></div><div id="side"></div></section></main>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SP={G:{n:"Medicina general",m:10,b:"Box 1"},P:{n:"Pediatría",m:12,b:"Box 2"},D:{n:"Dermatología",m:15,b:"Box 3"}};
let Q=[],C={G:0,P:0,D:0},seq=0,me=null,kiosk=null,tab="staff";
const wait=sp=>Q.filter(x=>x.sp==sp&&x.st=="w").sort((a,b)=>b.pr-a.pr||a.t-b.t);
const ahead=t=>wait(t.sp).indexOf(t);
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;$("#toasts").append(d);setTimeout(()=>d.remove(),5500)}
function add(name,sp,src){const t={id:"i"+(++seq),num:sp+"-"+String(++C[sp]).padStart(3,"0"),name,sp,pr:0,st:"w",t:seq,ts:Date.now(),src};Q.push(t);t.a0=ahead(t);t.a3=t.a0<=3?1:0;return t}
function call(sp){const cur=Q.find(x=>x.sp==sp&&x.st=="c");if(cur)cur.st="d";const n=wait(sp)[0];if(!n){toast("No hay pacientes en espera en "+SP[sp].n+".");return}n.st="c";if(n===me)toast("🔔 Notificación: es tu turno. Pasa al "+SP[sp].b+".")}
function alerts(){if(me&&me.st=="w"&&!me.a3&&ahead(me)<=3){me.a3=1;toast("🔔 Notificación: te faltan "+ahead(me)+" turnos. Prepárate.")}}
function phone(){const t=me;
 if(!t)return`<h2>Toma tu número</h2><p class="mut">Sin filas físicas: espera donde quieras y te avisamos.</p><label>Tu nombre<input id="nm" autocomplete="name" placeholder="Nombre y apellido"></label><label>Tipo de atención<select id="spsel">${Object.entries(SP).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")}</select></label><button class="p" data-a="take" style="width:100%;padding:12px">Tomar número</button>`;
 let h=`<p class="mut" style="margin:0">${esc(t.name)} · ${SP[t.sp].n}</p><div class="num">${t.num}</div>${t.pr?'<p class="mut">Turno prioritario</p>':""}`;
 if(t.st=="w"){const a=ahead(t),p=t.a0?Math.round((1-a/t.a0)*100):100;h+=`<p style="margin:6px 0"><b>Personas por delante:</b> ${a}<br><b>Tiempo estimado:</b> ${a?"≈ "+a*SP[t.sp].m+" min":"eres el siguiente"}</p><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div>`;if(a<=3)h+=`<div class="ban warn">${a?"Te faltan "+a+" turnos: ve acercándote.":"Eres el siguiente: acércate a la consulta."}</div>`;h+=`<button data-a="cancel">Cancelar mi turno</button>`}
 else if(t.st=="c")h+=`<div class="ban go">Es tu turno. Pasa al ${SP[t.sp].b}.</div>`;
 else if(t.st=="a")h+=`<div class="ban warn">Te marcaron como ausente. Pide a recepción que te reincorpore.</div>`;
 else h+=`<p>${t.st=="d"?"Tu atención finalizó. ¡Gracias!":"Cancelaste tu turno."}</p><button class="p" data-a="again">Tomar otro número</button>`;
 return h}
function staff(){const n=s=>Q.filter(x=>x.st==s).length;
 let h=`<div class="stats"><span>En espera <b>${n("w")}</b></span><span>Atendidos <b>${n("d")}</b></span><span>Ausentes <b>${n("a")}</b></span></div><div class="tabs"><button data-a="sim">+5 pacientes de prueba</button><button data-a="reset">Reiniciar</button></div>`;
 for(const k in SP){const w=wait(k),c=Q.find(x=>x.sp==k&&x.st=="c"),ab=Q.filter(x=>x.sp==k&&x.st=="a");
  h+=`<div class="hd"><h2 style="margin:0">${SP[k].n} <span class="mut">(${w.length} en espera)</span></h2><button class="p" data-a="call" data-sp="${k}" ${w.length||c?"":"disabled"}>Llamar siguiente</button></div>`;
  if(c)h+=`<div class="row cur"><b>${c.num}</b><span class="sp">${esc(c.name)} · en atención, ${SP[k].b}</span><button data-a="fin" data-id="${c.id}">Finalizar</button><button data-a="abs" data-id="${c.id}">Ausente</button></div>`;
  h+=w.map((t,i)=>`<div class="row"><b>${t.num}</b><span class="sp">${esc(t.name)}${t.pr?" · prioritario":""}<br><span class="mut">posición ${i+1} · llegó hace ${Math.floor((Date.now()-t.ts)/60000)} min</span></span><button data-a="prio" data-id="${t.id}">${t.pr?"Quitar prioridad":"Dar prioridad"}</button></div>`).join("");
  h+=ab.map(t=>`<div class="row"><b>${t.num}</b><span class="sp">${esc(t.name)} · ausente</span><button data-a="back" data-id="${t.id}">Reincorporar</button></div>`).join("");
  if(!w.length&&!c&&!ab.length)h+=`<p class="mut">Sin pacientes por ahora.</p>`}
 return h}
function kioskV(){let h=`<h2>Kiosko de la clínica</h2><label>Tu nombre (opcional)<input id="knm" placeholder="Nombre"></label><div class="kb">${Object.entries(SP).map(([k,v])=>`<button class="p" data-a="kt" data-sp="${k}">${v.n}</button>`).join("")}</div>`;
 if(kiosk)h+=`<div class="ban go" style="margin-top:16px"><div class="num" style="color:inherit">${kiosk.num}</div>${SP[kiosk.sp].n} · ${ahead(kiosk)>=0&&kiosk.st=="w"?ahead(kiosk)+" personas por delante":"ya fue llamado"}. Toma asiento: te llamaremos por pantalla.</div>`;
 return h}
function render(){$("#phone").innerHTML=phone();$("#side").innerHTML=tab=="staff"?staff():kioskV();document.querySelectorAll(".tabs [data-a=tab]").forEach(b=>b.classList.toggle("on",b.dataset.v==tab))}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,t=Q.find(x=>x.id==b.dataset.id);
 if(a=="tab")tab=b.dataset.v;
 else if(a=="take"){const n=$("#nm").value.trim();if(!n){toast("Escribe tu nombre para tomar un número.");return}me=add(n,$("#spsel").value,"app")}
 else if(a=="cancel")me.st="x";else if(a=="again")me=null;
 else if(a=="call")call(b.dataset.sp);
 else if(a=="fin")t.st="d";else if(a=="abs"){t.st="a";if(t===me)toast("🔔 Notificación: te marcaron como ausente.")}
 else if(a=="back"){t.st="w";t.a3=ahead(t)<=3?1:0}
 else if(a=="prio"){t.pr=t.pr?0:1}
 else if(a=="kt")kiosk=add(($("#knm").value.trim()||"Paciente kiosko"),b.dataset.sp,"kiosk");
 else if(a=="sim"){const N=["Rosa M.","Tomás P.","Elena V.","Jorge L.","Camila R.","Iván S."];for(let i=0;i<5;i++)add(N[Math.floor(Math.random()*N.length)],Object.keys(SP)[Math.floor(Math.random()*3)],"sim")}
 else if(a=="reset"){Q=[];C={G:0,P:0,D:0};me=null;kiosk=null}
 alerts();render()});
render();
</script></body></html>
